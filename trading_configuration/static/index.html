<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">
  <title>Trading Configuration</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside>
    <h1>AI Stock Bot</h1>
    <p>Profile, Strategy & Risk</p>
    <nav>
      <button class="active">Profile</button>
      <button>Universe</button>
      <button>Risk</button>
      <button>Strategies</button>
    </nav>
    <div class="safety">
      <strong>DRAFT ONLY</strong>
      <span>Activation OFF</span>
      <span>Broker Write OFF</span>
      <span>Orders OFF</span>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <h2>Trading Configuration</h2>
        <p>
          Review and save drafts without
          activating trading.
        </p>
      </div>
      <div class="pill">DRAFT ONLY</div>
    </header>

    <section class="panel">
      <h3>Profile</h3>
      <div class="form-grid">
        <label>
          Profile
          <select id="profile-key"></select>
        </label>
        <label>
          Trading Style
          <select id="trading-style">
            <option>MONITOR_ONLY</option>
            <option>SWING</option>
            <option>DAY_SWING</option>
            <option>DAY_TRADING</option>
            <option>SCALPING</option>
            <option>ETF_ROTATION</option>
          </select>
        </label>
        <label>
          Capital Limit ($)
          <input id="capital-limit"
                 type="number"
                 min="0"
                 step="100">
        </label>
        <label>
          Symbols
          <input id="symbols"
                 placeholder="SPY, QQQ, AAPL">
        </label>
      </div>
    </section>

    <section class="panel">
      <h3>Risk Controls</h3>
      <div class="form-grid">
        <label>
          Maximum Positions
          <input id="max-positions"
                 type="number" min="0" max="50">
        </label>
        <label>
          Maximum Per Position (%)
          <input id="max-position-percent"
                 type="number"
                 min="0" max="100" step="0.1">
        </label>
        <label>
          Maximum Daily Loss (%)
          <input id="max-daily-loss"
                 type="number"
                 min="0" max="20" step="0.1">
        </label>
        <label>
          Cash Reserve (%)
          <input id="cash-reserve"
                 type="number"
                 min="0" max="100" step="0.1">
        </label>
      </div>
      <div class="checks">
        <label>
          <input id="allow-short"
                 type="checkbox">
          Allow Short
        </label>
        <label>
          <input id="extended-hours"
                 type="checkbox">
          Extended Hours
        </label>
      </div>
    </section>

    <section class="panel">
      <h3>Strategies</h3>
      <div id="strategies"
           class="strategy-grid"></div>
    </section>

    <section class="panel">
      <div class="actions">
        <button id="validate">
          Validate Draft
        </button>
        <button id="save">
          Save Draft
        </button>
      </div>
      <pre id="result">
No validation or draft saved yet.
      </pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
