<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Signal Candidates / AI 신호 후보</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside>
    <h1>AI Stock Bot</h1>
    <p>AI Feature Engine<br>AI 특징 엔진</p>
    <nav>
      <button class="active">Overview / 전체 현황</button>
      <button>Features / 특징값</button>
      <button>Signals / 신호 후보</button>
      <button>Regime / 시장 국면</button>
      <button>Reasons / 판단 근거</button>
    </nav>
    <div class="safe">
      <strong>SIGNAL ONLY / 신호 전용</strong>
      <span>Broker Write OFF / 브로커 주문 차단</span>
      <span>Orders OFF / 주문 차단</span>
    </div>
  </aside>
  <main>
    <header>
      <div>
        <h2>AI Signal Candidates<br><small>AI 매수·매도·보유 후보</small></h2>
        <p id="updated">Loading / 불러오는 중...</p>
      </div>
      <div id="overall" class="pill">LOADING</div>
    </header>
    <section id="summary" class="summary"></section>
    <section id="candidates" class="candidate-grid"></section>
    <section class="panel">
      <h3>Full Bilingual Report / 전체 이중 언어 보고서</h3>
      <pre id="report"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
