<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">
  <title>AI Stock Bot Unified Portal</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside>
    <div class="brand">
      <strong>AI Stock Bot</strong>
      <span>Unified Portal</span>
    </div>
    <nav>
      <button data-view="overview"
              class="active">Overview</button>
      <button data-view="accounts">Accounts</button>
      <button data-view="positions">Positions</button>
      <button data-view="orders">Orders</button>
      <button data-view="reconciliation">
        Reconciliation
      </button>
    </nav>
    <div class="safety">
      <strong>READ ONLY</strong>
      <span>Broker Write OFF</span>
      <span>Orders OFF</span>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <h1 id="page-title">
          Multi-Broker Overview
        </h1>
        <p id="updated">Loading data...</p>
      </div>
      <div id="overall" class="status">
        LOADING
      </div>
    </header>

    <section id="summary" class="summary"></section>
    <section id="broker-cards"
             class="broker-grid"></section>
    <section class="panel">
      <div class="panel-heading">
        <h2 id="table-title">Overview</h2>
        <button id="refresh">Refresh</button>
      </div>
      <div id="content"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
